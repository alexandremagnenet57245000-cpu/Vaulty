<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="Vaulty, gestion de budget par Lézards, Kangourous, Écureuils et Aigle.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/images/logo-vaulty.png">
  <link rel="stylesheet" href="css/styles.css">
  <title>Vaulty</title>
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <header class="topbar">
    <button class="brand" id="homeButton" aria-label="Revenir à l'accueil">
      <img src="assets/images/logo-vaulty.png" alt="Logo Vaulty">
      <span><strong id="pageTitle">Vaulty</strong><small id="pageSubtitle">Mon budget, en équilibre</small></span>
    </button>
    <button class="icon-button" id="resetButton" title="Réinitialiser les données" aria-label="Réinitialiser les données">↻</button>
  </header>

  <main id="app" class="app-shell" tabindex="-1"></main>
  <nav id="sectionNav" class="glass-nav hidden" aria-label="Navigation de la section"></nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <template id="emptyStateTemplate">
    <div class="empty-state glass-card">
      <span class="empty-icon">✦</span>
      <h3>Aucun élément pour l'instant</h3>
      <p>Utilise le bouton + pour commencer.</p>
    </div>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
