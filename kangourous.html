oad(){try{let r=localStorage.getItem(KEY)||localStorage.getItem(OLD);return r?migrate(JSON.parse(r)):clone(EMPTY)}catch{return clone(EMPTY)}}function save(m='Enregistré'){try{localStorage.setItem(KEY,JSON.stringify(data));render();toast(m);return true}catch(error){console.error('Vaulty localStorage',error);alert('Vaulty n’a pas réussi à enregistrer les données sur cet appareil. Vérifie que le stockage du navigateur est autorisé.');return false}}function goTab(next,message){tab=next;history.replaceState(null,'','#'+next);return save(message)}function validMoney(value,label){const cents=toC(value);if(!String(value??'').trim()||cents<0){alert(label+' doit contenir un montant valide.');return null}return cents}function euros(c){return (+c||0)/100}function money(c){return new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(euros(c))}function sum(a,f=x=>x){return a.reduce((t,x)=>t+(+f(x)||0),0)}const uid=()=>crypto.randomUUID?.()||Date.now()+'',esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fd=f=>Object.fromEntries(new FormData(f).entries());document.addEventListener('click',e=>{if(e.target.closest('button,a,label'))navigator.vibrate?.(12)},{capture:true});function toast(m){let t=document.querySelector('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}function head(a,b){return `<header class="head"><span class="ey">Vaulty</span><h1>${a}</h1><p>${b}</p></header>`}function empty(){return '<div class="empty glass"><h3>Aucune donnée</h3><p class="muted">Utilise le bouton + pour commencer.</p></div>'}function setNav(items){nav.innerHTML=items.map(i=>`<button data-tab="${i[0]}" class="${tab===i[0]?'active':''}">${i[1]} ${i[2]}</button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(tab===b.dataset.tab)return;tab=b.dataset.tab;history.replaceState(null,'','#'+tab);app.classList.remove('view');void app.offsetWidth;render()})}fu
